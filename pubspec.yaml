name: meccsiq_pro
description: MeccsIQ Pro v2 - AI Football Analytics
publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # HTTP
  http: ^1.5.0

  # Cache
  shared_preferences: ^2.5.3

  # Images
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  collection: ^1.19.1

  # UI
  flutter_svg: ^2.2.0

  # AI / Google Gemini API
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

